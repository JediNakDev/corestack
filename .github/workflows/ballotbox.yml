# ballotbox: build and the CI test profile.
#
# GitHub only reads workflows from the repository root, so this file lives here
# rather than in ballotbox/ - and the job sets working-directory to ballotbox,
# because that is where the Makefile, .tetrishrc and var/ live.
name: ballotbox

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: ballotbox

jobs:
  test:
    # The build assumes Homebrew OpenSSL (`brew --prefix openssl` in
    # ../shared.mk) and the system programs use BSD/macOS APIs, so CI runs on
    # macOS.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      - name: Build
        run: make all

      # Runner-backed database cases are local-only because the third-party
      # build jars are intentionally not committed. Run `make java` followed by
      # `TETRISH_REQUIRE_RUNNER=1 make test` before merging changes to
      # libtetrisdb or libtetrisauth.
      - name: Run tests
        run: make test-ci
