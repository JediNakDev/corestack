name: Fuzz

# Two schedules, because fuzzing has two jobs and they are not the same job.
#
#   regress  - on every push and PR, seconds long, deterministic. Replays the
#              committed corpus and every filed crash under ASan. This is the
#              gate: it says "nothing we have already found came back".
#   nightly  - on a cron, an hour of actual mutation per target, corpus cached
#              between runs so each night starts where the last one stopped.
#              This is the search: it says "here is something new".
#
# The 24-hour campaign (`make fuzz-long`) is run by hand on a spare machine
# before the final presentation. A hosted runner is the wrong place for it -
# the job would be killed at the 6-hour limit and the corpus lost.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # 03:00 UTC daily. Nothing else runs then, so a slow nightly costs nobody.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  regress:
    # Same runner as CI, and deliberately so: bin/replay_* is built by Apple's
    # clang, needs no Homebrew LLVM, and exercises the same BSD/macOS APIs the
    # rest of the build assumes.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      # The archives libballotbrain/libtetrisdb/libtetrisutil, which the codec
      # targets link for bb_state_str and friends.
      - name: Build libraries
        run: make all

      - name: Replay corpus and filed crashes under ASan
        run: make fuzz-regress

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      # Homebrew LLVM, for libFuzzer only - Apple's clang has no fuzzer
      # runtime. See tests/fuzz/FUZZING.md for why the two compilers split the
      # work the way they do.
      - name: Install LLVM (libFuzzer)
        run: brew list llvm >/dev/null 2>&1 || brew install llvm

      - name: Build libraries
        run: make all

      # A fuzzer starting from an empty corpus relearns the grammar every
      # night. Restoring last night's corpus is what makes a nightly run
      # cumulative rather than ten identical first hours.
      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: tests/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Fuzz (10 minutes per target)
        run: make fuzz-smoke FUZZ_SMOKE_SECS=600

      # Always, not on success: a run that found something is exactly the run
      # whose corpus and crash are worth keeping.
      - name: Save corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tests/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            tests/fuzz/artifacts/
            tests/fuzz/regress/
          if-no-files-found: ignore

      - name: Coverage of the code under test
        if: always()
        run: make fuzz-cov || true
