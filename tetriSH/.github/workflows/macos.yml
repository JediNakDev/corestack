name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make all

      - name: Run tests
        run: make test-runner-selftest test-fast

      - name: Build interactive test harnesses
        run: make gui
