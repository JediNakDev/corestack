name: Ubuntu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libncurses-dev

      - name: Build
        run: make all

      - name: Run tests
        run: make test-runner-selftest test-fast

      - name: Build interactive test harnesses
        run: make gui
